  license: Apache-2.0
  homepage: https://github.com/anthropics/skills/tree/main/skills/frontend-design
  installName: frontend-design
  # Install methods from the author's README (they install the latest version, not the pinned commit).
  install:
    - label: Claude Code plugin marketplace
      commands: |-
