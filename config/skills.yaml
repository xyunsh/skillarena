# SkillArena skill list.
# `commit` is written automatically by `npm run fetch-skills` (pinned on first fetch).
# Delete a commit value to re-pin to the latest default-branch commit.
# `installName` is the skill's frontmatter name (folder name for a manual install, and its slash command).
# `install` lists the install methods documented in the skill's own README; the site adds a manual
# "exact tested version" install from repo + commit + path automatically.
