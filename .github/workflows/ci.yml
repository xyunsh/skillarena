name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn contract:check
      - run: cp .env.example .env && yarn build

  scan-skills:
    # A PR that changes the skill list: fetch the changed skills at their pinned commits and scan them.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skills changed?
        id: changed
        run: |
          if git diff --quiet origin/${{ github.base_ref }} -- config/skills.yaml; then echo "any=false" >> "$GITHUB_OUTPUT"; else echo "any=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.changed.outputs.any == 'true'
        with:
          node-version: 22
      - if: steps.changed.outputs.any == 'true'
        run: corepack enable && yarn install --immutable
      - if: steps.changed.outputs.any == 'true'
        # fetch-skills only extracts files with git archive; the scan exits non-zero on unreviewed high findings.
        run: yarn fetch-skills && yarn scan
