# Cloudflare Pages: the static site (web/out) plus the reference API in functions/api (hit, waitlist, try).
name = "skillarena"
compatibility_date = "2026-11-01"
pages_build_output_dir = "web/out"

# Create with: npx wrangler kv namespace create WAITLIST   → paste the id below.
[[kv_namespaces]]
binding = "WAITLIST"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
